name: Deploy to GitHub Pages

on:
  push:
    branches: [DEV, main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify and package Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install TypeScript dependencies
        working-directory: typescript
        run: npm ci
      - name: Install example dependencies
        run: python -m pip install --disable-pip-version-check -r examples/fastapi-demo/requirements.txt
      - name: Typecheck sources
        working-directory: typescript
        run: npm run typecheck
      - name: Typecheck tests
        working-directory: typescript
        run: npm run typecheck:tests
      - name: Run unit and integration tests
        working-directory: typescript
        run: npm run test
      - name: Build TypeScript and CSS distributions
        run: npm run build
      - name: Run UMD smoke test
        working-directory: typescript
        run: npm run smoke
      - name: Verify packed package consumers
        run: npm run verify:package
      - name: Run release and browser verification
        run: python3 scripts/verify.py
      - name: Verify committed build and Pages assets
        shell: bash
        run: |
          changes="$(git status --porcelain -- dist examples/fastapi-demo/static docs/dist docs/demo)"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            exit 1
          fi
      - name: Upload verified site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs
