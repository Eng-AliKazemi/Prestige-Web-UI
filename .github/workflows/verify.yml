name: Verify

on:
  push:
    branches: [DEV, TYPESCRIPT, WEB3, main, master]
  pull_request:

permissions:
  contents: read

jobs:
  typescript-checks:
    name: TypeScript checks (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install TypeScript dependencies
        working-directory: typescript
        run: npm ci
      - name: Audit locked npm dependencies
        working-directory: typescript
        run: npm audit --audit-level=high
      - name: Typecheck sources
        working-directory: typescript
        run: npm run typecheck
      - name: Typecheck tests
        working-directory: typescript
        run: npm run typecheck:tests
      - name: Unit and integration tests
        working-directory: typescript
        run: npm run test
      - name: Build bundles and CSS
        run: npm run build
      - name: UMD smoke test
        working-directory: typescript
        run: npm run smoke
      - name: Verify packed package consumers
        run: npm run verify:package
      - name: Verify committed build assets are in sync
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        shell: bash
        run: |
          changes="$(git status --porcelain -- dist examples/fastapi-demo/static docs/dist docs/demo)"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            exit 1
          fi

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install TypeScript dependencies
        working-directory: typescript
        run: npm ci
      - name: Install coverage provider
        working-directory: typescript
        run: npm install --no-save --ignore-scripts @vitest/coverage-v8@^3
      - name: Run tests with coverage
        working-directory: typescript
        run: npx vitest run --coverage --coverage.provider=v8 --coverage.reporter=text --coverage.reporter=json-summary
      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: typescript/coverage/coverage-summary.json

  release-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'
      # Direct requirements are pinned, but this is not a fully resolved,
      # hash-locked Python environment. Audit the declared dependency input.
      - name: Audit declared Python requirements (transitives are not locked)
        run: python -m pip_audit --requirement examples/fastapi-demo/requirements.txt --progress-spinner=off
      - name: Install example dependencies
        run: python -m pip install --disable-pip-version-check -r examples/fastapi-demo/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Release checks
        run: python3 scripts/verify.py
      - name: Verify committed assets are in sync
        shell: bash
        run: |
          changes="$(git status --porcelain -- dist examples/fastapi-demo/static docs/dist docs/demo)"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            exit 1
          fi
