name: Nightly browser regression

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [DEV]
    paths:
      - 'scripts/**'
      - 'css/**'
      - 'typescript/**'
      - 'docs/**'
      - 'examples/**'

permissions:
  contents: read

jobs:
  browser-regression:
    name: Headless browser regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install TypeScript dependencies
        working-directory: typescript
        run: npm ci
      - name: Install example dependencies
        run: python -m pip install --disable-pip-version-check -r examples/fastapi-demo/requirements.txt
      - name: Set up Chrome for headless checks
        uses: browser-actions/setup-chrome@v1
      - name: Build TypeScript and CSS distributions
        run: npm run build
      - name: Release and browser verification
        run: python3 scripts/verify.py
      - name: Verify committed build assets are in sync
        shell: bash
        run: |
          changes="$(git status --porcelain -- dist examples/fastapi-demo/static docs/dist docs/demo)"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            exit 1
          fi
