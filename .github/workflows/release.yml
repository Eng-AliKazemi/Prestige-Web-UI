name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install TypeScript dependencies
        working-directory: typescript
        run: npm ci
      - name: Install example dependencies
        run: python -m pip install --disable-pip-version-check -r examples/fastapi-demo/requirements.txt
      - name: Typecheck sources
        working-directory: typescript
        run: npm run typecheck
      - name: Typecheck tests
        working-directory: typescript
        run: npm run typecheck:tests
      - name: Unit and integration tests
        working-directory: typescript
        run: npm run test
      - name: Build TypeScript and CSS distributions
        run: npm run build
      - name: UMD smoke test
        working-directory: typescript
        run: npm run smoke
      - name: Verify packed package consumers
        run: npm run verify:package
      - name: Release and browser verification
        run: python3 scripts/verify.py
      - name: Verify committed build assets are in sync
        shell: bash
        run: |
          changes="$(git status --porcelain -- dist examples/fastapi-demo/static docs/dist docs/demo)"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            exit 1
          fi
